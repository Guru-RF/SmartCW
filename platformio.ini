[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = fatfs
board_build.filesystem_size = 1m
board_build.arduino.earlephilhower.usb_manufacturer = RF.Guru
board_build.arduino.earlephilhower.usb_product = SmartCW
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0xFF42
build_flags =
  ; lwIP is compiled from source: twice the memory (10 TCP connections, 32 KB heap)
  ; and IPv6, so smartcw.local answers AAAA lookups too (no 5 s wait in resolvers)
  -D__LWIP_MEMMULT=2
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_IPV6
  ; mDNS needs extra lwIP timers, twice as many with IPv6
  -DMEMP_NUM_SYS_TIMEOUT=32
  -Wl,--wrap=panic
  -DNCMETHERNET_XMIT_QUEUE_LENGTH=24
lib_ldf_mode = deep+
extra_scripts = pre:tools/build_web.py
monitor_speed = 115200
