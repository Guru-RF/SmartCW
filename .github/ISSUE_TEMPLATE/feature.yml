name: Feature request
description: Something SmartCW could do that it does not do yet.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One feature per issue, named in the title after **Feature:** (`Feature: Farnsworth spacing in the trainer`). More in the README's [Requesting a feature](https://github.com/Guru-RF/SmartCW#requesting-a-feature).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I looked at the open issues, and this feature is not among them. If it is, I add what I would use it for to that issue instead.
          required: true
  - type: input
    id: version
    attributes:
      label: Firmware version you run
      description: "The web interface's System page, or `!version`."
      placeholder: "2.3.4"
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: "The operating it is for (a contest, a remote station, practice, an SDR set-up, a club net), not only the feature: \"send the exchange from N1MM+ with the serial number cut\" says more than \"add cut numbers\"."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: "With SmartCW as it is, another keyer, a program on the computer or a phone app, and what is missing or awkward about it."
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it would live
      description: "A web page (Live, Settings, Trainer, System), a `config.txt` setting, a serial or TCP command, the WinKeyer or cwdaemon side, MIDI, the PTT button or the paddles; what you would press and what you would see. A sketch, or a screenshot of another program that does it, helps."
  - type: textarea
    id: depends
    attributes:
      label: What it depends on
      description: "A program, a protocol, a service or a device, with a link to its specification, its API or its rules, and whether it needs an account or a key."
  - type: checkboxes
    id: help
    attributes:
      label: How you can help
      options:
        - label: Testing it on my SmartCW
        - label: A pull request
        - label: The documentation
