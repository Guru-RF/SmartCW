name: Bug report
description: Something on SmartCW, or on its web pages, does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. What to give, and why, is in the README's [Reporting a problem](https://github.com/Guru-RF/SmartCW#reporting-a-problem).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I looked at the open issues, and this problem is not among them.
          required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: "The web interface's System page, or `!version` on the serial port."
      placeholder: "2.3.4"
    validations:
      required: true
  - type: input
    id: serial
    attributes:
      label: RF.Guru serial number
      description: "The System page, or `!id`. Leave it empty for a SmartCW you built yourself."
      placeholder: SCW-00042
  - type: dropdown
    id: install
    attributes:
      label: How it got this version
      options:
        - As delivered
        - smartcw.app/update
        - UF2 dragged onto the RPI-RP2 drive
        - Built from source
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: Updated from
      description: "When it was updated: the version before."
      placeholder: "2.3.3"
  - type: input
    id: os
    attributes:
      label: The computer
      description: "Its operating system and version, and the browser for a web page problem."
      placeholder: Windows 11 24H2, Chrome 142
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: The program or connection in use
      description: "What SmartCW was talking to when it went wrong. Several may apply."
      multiple: true
      options:
        - The web interface (smartcw.local)
        - Serial port, text protocol
        - TCP port 23
        - WinKeyer (a contest logger)
        - cwdaemon (UDP 6789)
        - MIDI (SDR software, Vail)
        - USB keyboard mode
        - vBand or Vail with the paddle keys
        - Nothing, only the paddles and the radio
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: The program and its version
      description: "For a logger, SDR program or other software: its name and version, and how it is set up for SmartCW."
      placeholder: N1MM+ 1.0.11000 as WinKeyer on COM5
  - type: input
    id: key
    attributes:
      label: Key type and paddle
      description: "The `keyer` setting (iambicA, iambicB, ultimatic, bug, straight) and the paddle or key, with `paddleSwap` if set."
      placeholder: iambicB, Bencher BY-1
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: The radio and how it is wired
      description: "The radio, the `output` setting (key, audio, off), and what is connected to CW, PTT and audio on the breakout."
      placeholder: IC-7300, output key, breakout CW to the KEY jack
  - type: dropdown
    id: boot
    attributes:
      label: Boot mode
      description: "What was held while plugging in the cable."
      options:
        - Nothing (normal)
        - Both paddles (the SMARTCW drive)
        - The PTT button (USB keyboard)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: "What you did, what you expected and what you got. The speed, the mode and the page or command you were using. For a keying problem, what you keyed and what came out (on air, on the sidetone, as decoded text). A short video of the paddles and the LEDs says a lot."
    validations:
      required: true
  - type: textarea
    id: leds
    attributes:
      label: The LEDs
      description: "What PWR, DIT, DAH, SER and SER2 did while it went wrong (see the README's LEDs table), and whether unplugging and plugging in again brought it back."
  - type: textarea
    id: state
    attributes:
      label: config.txt or !status
      description: "Your `config.txt` (from the SMARTCW drive or the web interface's System page), or the output of `!status` and `!state` on the serial port, which also shows a recorded crash. Blank out your callsign, the memories and anything else you would rather keep to yourself; the settings are what matters."
      render: text
